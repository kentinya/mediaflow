x-mediaflow-environment: &mediaflow-environment
  MEDIAFLOW_CONFIG: /config/mediaflow.json
  MEDIAFLOW_DATA_DIR: /data
  MEDIAFLOW_ENV_FILE: /run/mediaflow/deployment.env

# A fresh installation needs only the application bootstrap file, the durable
# data volume and the deployment environment file.  Local Storage needs a real
# media directory, and which directory that is depends entirely on the host, so
# it is NOT declared here: a bind mount with a default path would make a fresh
# `docker compose up` fail on a machine that has no media directory yet.
#
# Instead, adding media is an explicit deployment step.  Apply the documented
# overlay, which declares the same two confined mounts:
#
#   docker compose -f compose.yaml -f compose.media-mounts.yaml up -d
#
# The overlay is a separate file precisely so that the default topology has no
# media mount at all, and so adding one is visible in a deployment's Compose
# invocation rather than hidden behind a default value.
x-mediaflow-volumes: &mediaflow-volumes
  - mediaflow-data:/data
  - type: bind
    source: ${MEDIAFLOW_CONFIG_FILE:-./config/mediaflow.json}
    target: /config/mediaflow.json
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${MEDIAFLOW_ENV_FILE:-./.env.mediaflow}
    target: /run/mediaflow/deployment.env
    read_only: true
    bind:
      create_host_path: false

x-mediaflow-service: &mediaflow-service
  image: ${MEDIAFLOW_IMAGE:-mediaflow:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  user: "${MEDIAFLOW_UID:-10001}:${MEDIAFLOW_GID:-10001}"
  environment: *mediaflow-environment
  volumes: *mediaflow-volumes

x-mediaflow-healthcheck: &mediaflow-healthcheck
  interval: 10s
  timeout: 3s
  start_period: 15s
  retries: 5

services:
  api:
    <<: *mediaflow-service
    command: ["api", "serve-production", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      <<: *mediaflow-healthcheck
      test:
        [
          "CMD",
          "python",
          "-m",
          "mediaflow.container_probe",
          "check",
          "--service",
          "api",
          "--url",
          "http://127.0.0.1:8080/health",
        ]
    ports:
      - "${MEDIAFLOW_API_BIND:-127.0.0.1}:${MEDIAFLOW_API_PORT:-8080}:8080"

  worker:
    <<: *mediaflow-service
    command: ["worker", "run"]
    healthcheck:
      <<: *mediaflow-healthcheck
      test:
        [
          "CMD",
          "python",
          "-m",
          "mediaflow.container_probe",
          "check",
          "--service",
          "worker",
        ]

  scheduler:
    <<: *mediaflow-service
    command: ["scheduler", "run"]
    healthcheck:
      <<: *mediaflow-healthcheck
      test:
        [
          "CMD",
          "python",
          "-m",
          "mediaflow.container_probe",
          "check",
          "--service",
          "scheduler",
        ]

  notification-worker:
    <<: *mediaflow-service
    command: ["notification-worker", "run"]
    healthcheck:
      <<: *mediaflow-healthcheck
      test:
        [
          "CMD",
          "python",
          "-m",
          "mediaflow.container_probe",
          "check",
          "--service",
          "notification-worker",
        ]

volumes:
  mediaflow-data:
