name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared development and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,test]"
      - name: Governance
        run: python scripts/check_governance.py
      - name: Formatter
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Offline unit tests
        run: python -m unittest discover -s tests
      - name: Compile
        run: python -m compileall -q mediaflow tests scripts
      - name: Dependency consistency
        run: python -m pip check
      - name: Configuration examples
        run: |
          mediaflow --config config/strategy.example.json config validate
          mediaflow --config config/mediaflow.phase13.2.example.json config validate
      - name: Forbidden runtime dependency audit
        run: test -z "$(rg -n -i 'ffprobe|ffmpeg' mediaflow pyproject.toml || true)"

  wheel:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared build and validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Isolated installed-wheel smoke test
        run: python scripts/wheel_smoke_test.py dist/mediaflow-*.whl
